<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b-a);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

/* ------------------------------------------------------------------ */
/* Renderer / scene                                                    */
/* ------------------------------------------------------------------ */
const app = $('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a18);
scene.fog = new THREE.Fog(0x070a18, 55, 200);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, .1, 450);

const hemi = new THREE.HemisphereLight(0x88aaff, 0x0a0d1c, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.25);
sun.position.set(-18, 30, 12);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x7ef9ff, .8);
rim.position.set(14, 8, -20);
scene.add(rim);

/* Stars */
{
  const n = 450, pos = new Float32Array(n*3);
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, e = rand(.12,1.2), r = 380;
    pos[i*3] = Math.cos(a)*Math.cos(e)*r; pos[i*3+1] = Math.sin(e)*r*.6+20; pos[i*3+2] = -Math.abs(Math.sin(a)*Math.cos(e)*r) - 40;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:1.6, sizeAttenuation:false, fog:false, transparent:true, opacity:.7 }));
  stars.frustumCulled = false;
  scene.add(stars);
}

/* ------------------------------------------------------------------ */
/* Zones: the whole world re-colours every 1500 m                       */
/* ------------------------------------------------------------------ */
const C = h => new THREE.Color(h);
const ZONES = [
  { name:'NEON NIGHT',   bg:C(0x070a18), hemi:C(0x88aaff), road:C(0x141826), post:C(0x8f7bff), cap:C(0x7ef9ff), edge:C(0x7ef9ff), trims:[C(0xff3df0),C(0x7ef9ff),C(0x8f7bff)] },
  { name:'SUNSET STRIP', bg:C(0x2b1030), hemi:C(0xffa07a), road:C(0x24152a), post:C(0xff8f3f), cap:C(0xffd166), edge:C(0xffd166), trims:[C(0xff5d73),C(0xffd166),C(0xff8f3f)] },
  { name:'TOXIC TUNNEL', bg:C(0x04150f), hemi:C(0x7dffb0), road:C(0x0e1b17), post:C(0x39d98a), cap:C(0xd7ff6a), edge:C(0x39d98a), trims:[C(0x39d98a),C(0xd7ff6a),C(0x4fc3f7)] },
  { name:'ICE GRID',     bg:C(0x0a1426), hemi:C(0xbfe3ff), road:C(0x131d30), post:C(0x4fc3f7), cap:C(0xffffff), edge:C(0xffffff), trims:[C(0x4fc3f7),C(0xffffff),C(0x8f7bff)] },
];
const roadMat   = new THREE.MeshStandardMaterial({ color:ZONES[0].road.clone(), roughness:.85, metalness:.05 });
const groundMat = new THREE.MeshStandardMaterial({ color:0x0b1020, roughness:1 });
const dashMat   = new THREE.MeshBasicMaterial({ color:0xdfe9ff });
const edgeMat   = new THREE.MeshBasicMaterial({ color:ZONES[0].edge.clone() });
const postMat   = new THREE.MeshBasicMaterial({ color:ZONES[0].post.clone() });
const capMat    = new THREE.MeshBasicMaterial({ color:ZONES[0].cap.clone() });
const bodyMat   = new THREE.MeshBasicMaterial({ color:0x0a0f20 });
const trimMats  = ZONES[0].trims.map(c => new THREE.MeshBasicMaterial({ color:c.clone() }));
let zoneIdx = 0;
function blendZone(dt){
  const Z = ZONES[zoneIdx], k = 1 - Math.exp(-dt*1.3);
  scene.background.lerp(Z.bg, k);
  scene.fog.color.copy(scene.background);
  hemi.color.lerp(Z.hemi, k);
  roadMat.color.lerp(Z.road, k);
  edgeMat.color.lerp(Z.edge, k);
  postMat.color.lerp(Z.post, k);
  capMat.color.lerp(Z.cap, k);
  trimMats.forEach((m,i) => m.color.lerp(Z.trims[i], k));
}

/* ------------------------------------------------------------------ */
/* World constants                                                     */
/* ------------------------------------------------------------------ */
const LANES = [-7.5, -2.5, 2.5, 7.5];
const ROAD_W = 22;
const SEG_LEN = 160;
const SEG_COUNT = 4;
const CAR_LEN = 4.4, CAR_W = 2.15;
const GAP_MAX = 150;

/* Road segments scroll toward the camera and recycle ahead */
const unitBox = new THREE.BoxGeometry(1,1,1);
const roadGeo = new THREE.PlaneGeometry(ROAD_W, SEG_LEN); roadGeo.rotateX(-Math.PI/2);
const groundGeo = new THREE.PlaneGeometry(260, SEG_LEN); groundGeo.rotateX(-Math.PI/2);
const edgeGeo = new THREE.PlaneGeometry(.35, SEG_LEN); edgeGeo.rotateX(-Math.PI/2);
const dashGeo = new THREE.PlaneGeometry(.28, 5); dashGeo.rotateX(-Math.PI/2);
const postGeo = new THREE.BoxGeometry(.25,2.6,.25);
const capGeo = new THREE.BoxGeometry(.7,.16,.7);
const segments = [];
function makeRoadSegment(z) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(roadGeo, roadMat));
  const ground = new THREE.Mesh(groundGeo, groundMat); ground.position.y = -.02; g.add(ground);

  const dashes = new THREE.InstancedMesh(dashGeo, dashMat, 48);
  const d = new THREE.Object3D(); let n = 0;
  for (let i=0;i<3;i++) {
    const x = (LANES[i]+LANES[i+1])/2;
    for (let z0=-SEG_LEN/2; z0<SEG_LEN/2; z0+=10) { d.position.set(x,.01,z0+2.5); d.updateMatrix(); dashes.setMatrixAt(n++, d.matrix); }
  }
  dashes.frustumCulled = false; g.add(dashes);

  [-ROAD_W/2+.5, ROAD_W/2-.5].forEach(x => { const l = new THREE.Mesh(edgeGeo, edgeMat); l.position.set(x,.012,0); g.add(l); });

  for (let z0=-SEG_LEN/2+8; z0<SEG_LEN/2; z0+=24) {
    [-13.5,13.5].forEach(x => {
      const p = new THREE.Mesh(postGeo, postMat); p.position.set(x,1.3,z0); g.add(p);
      const cap = new THREE.Mesh(capGeo, capMat); cap.position.set(x,2.65,z0); g.add(cap);
    });
  }

  // neon skyline
  for (const side of [-1,1]) {
    for (let z0=-SEG_LEN/2+4; z0<SEG_LEN/2-4; z0+=rand(11,17)) {
      const w = rand(6,13), h = rand(8,44), dd = rand(7,12);
      const x = side*(17 + w/2 + rand(0,10));
      const b = new THREE.Mesh(unitBox, bodyMat); b.scale.set(w,h,dd); b.position.set(x,h/2,z0); g.add(b);
      const trim = trimMats[(Math.random()*3)|0];
      const inner = x - side*(w/2 + .05);
      const v = new THREE.Mesh(unitBox, trim); v.scale.set(.3,h*.96,.35); v.position.set(inner,h/2,z0 + dd/2 - .3); g.add(v);
      for (let y=rand(2,4); y<h-1; y+=rand(4.5,7)) {
        const band = new THREE.Mesh(unitBox, trim); band.scale.set(.3,.35,dd*.9); band.position.set(inner,y,z0); g.add(band);
      }
    }
  }
  g.position.z = z;
  scene.add(g);
  return g;
}
for (let i=0;i<SEG_COUNT;i++) segments.push(makeRoadSegment(i*SEG_LEN - 400));

/* ------------------------------------------------------------------ */
/* Vehicles (geometry + materials are cached so spawning is cheap)     */
/* ------------------------------------------------------------------ */
/* Soft-edged box: subdivide a box and push the outer shell onto a rounded surface */
function roundedBox(w,h,d,r,o={}){
  r = Math.min(r, w/2-.001, h/2-.001, d/2-.001);
  const seg = o.seg || 8;
  const g = new THREE.BoxGeometry(w,h,d,seg,seg,seg);
  const p = g.attributes.position, n = g.attributes.normal;
  const hw=w/2-r, hh=h/2-r, hd=d/2-r, tx=o.tx||0, tz=o.tz||0, sz=o.sz||0;
  for (let i=0;i<p.count;i++){
    let x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const ix=clamp(x,-hw,hw), iy=clamp(y,-hh,hh), iz=clamp(z,-hd,hd);
    let dx=x-ix, dy=y-iy, dz=z-iz; const l=Math.hypot(dx,dy,dz);
    if (l > 1e-6){ dx/=l; dy/=l; dz/=l; x=ix+dx*r; y=iy+dy*r; z=iz+dz*r; n.setXYZ(i,dx,dy,dz); }
    if (tx || tz || sz){ const t = (y + h/2)/h; x *= 1 - tx*t; z = z*(1 - tz*t) + sz*t; }
    p.setXYZ(i,x,y,z);
  }
  return g;
}
const rbCache = {};
const RB = (w,h,d,r,o={}) => { const k=[w,h,d,r,o.tx||0,o.tz||0,o.sz||0].join(','); return rbCache[k] || (rbCache[k] = roundedBox(w,h,d,r,o)); };
const gcache = {};
const cached = (k, fn) => gcache[k] || (gcache[k] = fn());

const M = {
  glass:  new THREE.MeshStandardMaterial({ color:0x0d1220, roughness:.12, metalness:.8 }),
  dark:   new THREE.MeshStandardMaterial({ color:0x0a0c14, roughness:.7, metalness:.2 }),
  tail:   new THREE.MeshBasicMaterial({ color:0xff3355 }),
  plate:  new THREE.MeshBasicMaterial({ color:0xe8ecf5 }),
  wheel:  new THREE.MeshStandardMaterial({ color:0x06070c, roughness:.9 }),
  chrome: new THREE.MeshStandardMaterial({ color:0xaab4c8, roughness:.25, metalness:.9 }),
  amber:  new THREE.MeshBasicMaterial({ color:0xffb347 }),

function wheelGeo(r, wd=.34){
  return cached('wheel'+r+'_'+wd, () => {
    const h = wd/2;
    const pts = [[0,-h],[r-.1,-h],[r-.03,-h*.8],[r,-h*.4],[r,h*.4],[r-.03,h*.8],[r-.1,h],[0,h]].map(q => new THREE.Vector2(q[0],q[1]));
    const g = new THREE.LatheGeometry(pts, 20); g.rotateZ(Math.PI/2); return g;
  });
}
function part(g, geo, mat, x, y, z, rx=0){ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); if (rx) m.rotation.x = rx; g.add(m); return m; }
function wheels(g, r, xs, zs, wd){ for (const z of zs) for (const s of [-1,1]) part(g, wheelGeo(r,wd), M.wheel, s*xs, r, z); }
function plate(g,y,z){ part(g, RB(.5,.2,.05,.03), M.plate, 0, y, z); }
function exhaust(g,x,y,z){ part(g, cached('exh', () => { const c = new THREE.CylinderGeometry(.09,.09,.3,12); c.rotateX(Math.PI/2); return c; }), M.chrome, x, y, z); }

  for (const s of [-1,1]) {

  // rider
  const torso = new THREE.Group(); torso.position.set(0,2.0,-.05); torso.rotation.x = -.5; g.add(torso);
  torso.add(new THREE.Mesh(cap(.3,.5), suit));
  const st = new THREE.Mesh(RB(.1,.75,.04,.02), stripeM); st.position.set(0,0,.31); torso.add(st);
  const sh = new THREE.Mesh(RB(.62,.07,.04,.02), stripeM); sh.position.set(0,.3,.29); torso.add(sh);
  for (const s of [-1,1]) {
    part(g, cap(.09,.5), suit, s*.36,1.88,-.58,.88);
    part(g, cap(.13,.55), suit, s*.32,1.45,-.12,1.19);
    part(g, cap(.1,.45), suit, s*.33,1.02,-.42,-.27);
    part(g, RB(.18,.14,.4,.06), M.dark, s*.33,.72,-.3);
  }
  const helmet = new THREE.Group(); helmet.position.set(0,2.62,-.35); g.add(helmet);
  const hs = new THREE.Mesh(cached('helm', () => new THREE.SphereGeometry(.34,20,16)), helmM); hs.scale.set(1,1.05,1.12); helmet.add(hs);
  const stripe = new THREE.Mesh(cached('hstripe', () => { const t = new THREE.TorusGeometry(.345,.03,6,24); t.rotateY(Math.PI/2); return t; }), stripeM); stripe.scale.set(1,1.05,1.12); helmet.add(stripe);
  const visor = new THREE.Mesh(cached('visor', () => new THREE.SphereGeometry(.24,12,10)), M.glass); visor.scale.set(1.1,.7,.8); visor.position.set(0,.03,-.22); helmet.add(visor);
  // scarf (player)
  if (!isPolice) {

    const sc = new THREE.Mesh(RB(.14,.03,.8,.015,{seg:2}), accM); sc.position.set(0,0,.4); pivot.add(sc);
    g.userData.scarf = pivot;
  }
  // police rack + lights
  if (isPolice) {
    part(g, RB(.55,.5,.55,.16), new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.3 }), 0,1.8,.85);
    part(g, RB(.2,.1,.2,.04), policeRed, -.14,2.1,.85); part(g, RB(.2,.1,.2,.04), policeBlue, .14,2.1,.85);

  // headlight + light on the road
  part(g, new THREE.SphereGeometry(.16,10,8), new THREE.MeshBasicMaterial({ color:accent }), 0,.95,-1.75);

  gl.scale.set(.6,1,1.5); gl.position.y = .04; g.add(gl);
  g.userData.glow = gm;
  return g;
}

const PN = 600;
const pPos = new Float32Array(PN*3), pCol = new Float32Array(PN*3), pVel = new Float32Array(PN*3), pBase = new Float32Array(PN*3);
const pLife = new Float32Array(PN), pMax = new Float32Array(PN), pGrav = new Float32Array(PN);
for (let i=0;i<PN;i++) pPos[i*3+1] = -999;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol,3).setUsage(THREE.DynamicDrawUsage));
const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({ size:.6, vertexColors:true, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
pts.frustumCulled = false; scene.add(pts);
let pHead = 0; const tmpC = new THREE.Color();
function emit(x,y,z,vx,vy,vz,color,life,grav=0){
  const i = pHead; pHead = (pHead+1)%PN; const k = i*3;
  pPos[k]=x; pPos[k+1]=y; pPos[k+2]=z; pVel[k]=vx; pVel[k+1]=vy; pVel[k+2]=vz;
  tmpC.set(color); pBase[k]=tmpC.r; pBase[k+1]=tmpC.g; pBase[k+2]=tmpC.b;
  pLife[i]=life; pMax[i]=life; pGrav[i]=grav;
}
function burst(x,y,z,n,color,spd,life=.7,grav=14){
  for (let i=0;i<n;i++) emit(x,y,z, rand(-1,1)*spd, rand(.2,1)*spd, rand(-1,1)*spd, color, life*rand(.6,1), grav);
}
function updateParticles(dt, ws){
  for (let i=0;i<PN;i++){
    const k = i*3;
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt;
    if (pLife[i] <= 0){ pPos[k+1] = -999; pCol[k]=pCol[k+1]=pCol[k+2]=0; continue; }
    pVel[k+1] -= pGrav[i]*dt;
    pPos[k] += pVel[k]*dt; pPos[k+1] = Math.max(.05, pPos[k+1] + pVel[k+1]*dt); pPos[k+2] += pVel[k+2]*dt + ws*dt;
    const f = pLife[i]/pMax[i];
    pCol[k]=pBase[k]*f; pCol[k+1]=pBase[k+1]*f; pCol[k+2]=pBase[k+2]*f;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

let AC = null, master = null, engOsc = null, engGain = null, engFilt = null, noiseBuf = null;
let muted = store.get('he_mute') === '1';
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : .5; master.connect(AC.destination);
    engOsc = AC.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 60;
    engFilt = AC.createBiquadFilter(); engFilt.type = 'lowpass'; engFilt.frequency.value = 380;
    engGain = AC.createGain(); engGain.gain.value = 0;
    engOsc.connect(engFilt); engFilt.connect(engGain); engGain.connect(master); engOsc.start();
    noiseBuf = AC.createBuffer(1, AC.sampleRate*.6, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  } catch(e){ AC = null; }
}
function tone(freq, dur, type='sine', vol=.2, to=0, delay=0){
  if (!AC) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30,to), t0+dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.02);
}
function noiseHit(dur, vol, freq=800){
  if (!AC) return;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(AC.currentTime+dur);
}

function spawnCar(initial=false){
  for (let tries=0; tries<8; tries++){
    const lane = (Math.random()*4)|0;
    const z = initial ? -38 - Math.random()*150 : -200 - Math.random()*40;
    let blocked = false; const occ = new Set([lane]);
    for (const o of traffic){
      const dz = Math.abs(o.position.z - z);
      if (dz < 24) occ.add(o.userData.lane);
      if (o.userData.lane === lane && dz < 18) blocked = true;
    }
    if (blocked || occ.size >= 4) continue;
    const isTruck = Math.random() < .15;
    const kind = isTruck ? 'truck' : CAR_KINDS[(Math.random()*CAR_KINDS.length)|0];
    const c = makeCar(carColors[(Math.random()*carColors.length)|0], kind);
    const base = [30,27,23,19][lane] + rand(-3,3) + Math.min(6, S.distance/1500);
    c.position.set(LANES[lane], 0, z);
    c.userData = { lane, v:base, cur:base, truck:isTruck, scored:false, dead:false };
    scene.add(c); traffic.push(c);
    return;
  }
}

/* ------------------------------------------------------------------ */
/* Main loop                                                           */
/* ------------------------------------------------------------------ */
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  /* ---------------- game state ---------------- */
  if (S.running){
    const cruise = 46 + Math.min(22, S.distance/800);
    // boost
    const want = (inp.swipe || inp.btn || inp.key) && S.boost > (S.boosting ? 0 : 8);
    S.boosting = want || S.nitro > 0;
    if (S.nitro > 0) S.nitro -= dt;
    else if (S.boosting) S.boost = Math.max(0, S.boost - 22*dt);
    else S.boost = Math.min(100, S.boost + 2.5*dt);
    if (S.boosting && !S.wasBoosting) sfx.boost();
    S.wasBoosting = S.boosting;

    const target = S.boosting ? S.maxSpeed : (inp.brake ? 18 : cruise);
    S.speed += (target - S.speed) * (inp.brake ? 3 : S.boosting ? 2.6 : 1.4) * dt;
    S.speed = Math.max(14, S.speed);

    S.distance += S.speed*dt;
    addScore(S.speed*dt*.4 * (S.boosting?1.5:1));

    // steering
    S.x += (S.targetX - S.x) * Math.min(1, 9*dt);
    const lean = S.targetX - S.x;
    player.position.set(S.x, 0, 0);
    player.rotation.z = lean * -.09;
    player.rotation.y = lean * -.05;
    player.rotation.x += ((S.boosting ? .1 : 0) - player.rotation.x) * Math.min(1, 6*dt);

    // zones
    const zi = Math.floor(S.distance/1500) % ZONES.length;
    if (zi !== zoneIdx){ zoneIdx = zi; toast('ZONE ' + (Math.floor(S.distance/1500)+1), ZONES[zi].name); sfx.zone(); }

    // chase model
    S.policeSpeed = 45 + Math.min(26, S.distance/650) + (S.gap < 40 ? 5 : 0);
    S.gap = Math.min(GAP_MAX, S.gap + (S.speed - S.policeSpeed)*.5*dt);

    // spawners
    S.nextCoin -= S.speed*dt; if (S.nextCoin <= 0){ spawnCoinPattern(); S.nextCoin = rand(70,150); }
    S.nextPower -= S.speed*dt; if (S.nextPower <= 0){ addPower(Math.random()<.5?'shield':'nitro', LANES[(Math.random()*4)|0], -190); S.nextPower = rand(380,620); }

    // timers
    S.comboTimer -= dt; if (S.comboTimer <= 0) S.combo = 0;
    if (S.invuln > 0) S.invuln -= dt;
    player.visible = !(S.invuln > 0 && Math.floor(t*16)%2);

    // danger feedback
    if (S.gap < 40){
      S.sirenT -= dt; if (S.sirenT <= 0){ sfx.siren(Math.floor(t*2)%2); S.sirenT = .25; }
    }
    $('siren').classList.toggle('on', S.gap < 40);
    $('gapBar').classList.toggle('danger', S.gap < 30);
    if (S.gap <= 0){ S.gap = 0; endGame(); }
  }

  /* ---------------- world scroll speed ---------------- */
  let ws;
  if (S.running) { ws = worldSpeed = S.speed; }
  else { worldSpeed += ((S.over ? 0 : 20) - worldSpeed) * Math.min(1, 2*dt); ws = worldSpeed; }

  // road + scenery
  segments.forEach(seg => { seg.position.z += ws*dt; if (seg.position.z - SEG_LEN/2 > 60) seg.position.z -= SEG_LEN*SEG_COUNT; });
  if (!S.running && !S.over) {} // menu keeps scrolling
  blendZone(dt);

  /* ---------------- traffic ---------------- */
  S.spawnT -= dt;
  const want = 20 + Math.min(8, Math.floor(S.distance/700));
  if (S.spawnT <= 0 && traffic.length < want){ spawnCar(); S.spawnT = .2; }

  for (const c of traffic){   // simple lane-following so cars don't drive through each other
    const u = c.userData; u.cur = u.v;
    if (u.dead) continue;
    for (const o of traffic){
      if (o === c || o.userData.dead || o.userData.lane !== u.lane) continue;
      const d = c.position.z - o.position.z;
      if (d > 0 && d < 13 + (o.userData.truck?4:0)) u.cur = Math.min(u.cur, o.userData.v - .5);
    }
  }
  for (let i=traffic.length-1;i>=0;i--){
    const c = traffic[i], u = c.userData;
    c.position.z += (ws - u.cur)*dt;
    if (u.dead){
      c.position.x += u.vx*dt; c.position.y += u.vy*dt; u.vy -= 32*dt;
      c.rotation.z += u.sp*dt; c.rotation.x += u.sp*.5*dt; u.life -= dt;
      if (u.life <= 0 || c.position.y < -6){ scene.remove(c); traffic.splice(i,1); }
      continue;
    }
    if (c.position.z > 30 || c.position.z < -260){ scene.remove(c); traffic.splice(i,1); continue; }
    if (!S.running) continue;

    const dx = Math.abs(c.position.x - S.x), dz = Math.abs(c.position.z);
    const hitZ = u.truck ? 4.5 : 2.8;
    if (dx < 1.55 && dz < hitZ){
      if (S.boosting) smash(c);
      else if (S.invuln > 0) { /* ghosting through */ }
      else if (S.shield){ S.shield = false; bubble.visible = false; shockwave(); }
      else { crash(c); if (S.gap <= 0){ S.gap = 0; endGame(); } }
    } else if (!u.scored && dz < 3.2 && dx >= 1.55 && dx < 5.4){
      u.scored = true;
      if (dx < 3.6){
        S.nearMiss++; S.combo++; S.comboTimer = 2.4; S.maxCombo = Math.max(S.maxCombo, S.combo);
        S.boost = Math.min(100, S.boost + 8); S.gap = Math.min(GAP_MAX, S.gap + 2.5);
        addScore(100); pop('NEAR MISS ×' + mult() + '  +' + 100*mult(), '#c9b8ff', 26); sfx.near(); vibrate(10);
        emit(S.x + (c.position.x-S.x)*.5, 1.2, 0, 0, 3, 0, 0xc9b8ff, .5);
      } else { S.boost = Math.min(100, S.boost + 1.5); addScore(10); sfx.close(); }
    }
  }

  /* ---------------- pickups ---------------- */
  for (let i=pickups.length-1;i>=0;i--){
    const p = pickups[i], type = p.userData.type;
    p.position.z += ws*dt;
    p.rotation.y += dt*(type==='coin'?4:2.2);
    if (type !== 'coin') { p.rotation.x += dt*1.3; p.position.y = 1.8 + Math.sin(t*3)*.25; }
    if (p.position.z > 20){ scene.remove(p); pickups.splice(i,1); continue; }
    if (!S.running) continue;
    if (Math.abs(p.position.z) < 3 && Math.abs(p.position.x - S.x) < 2.2){
      scene.remove(p); pickups.splice(i,1);
      if (type === 'coin'){
        S.coins++; S.boost = Math.min(100, S.boost + 1.2); addScore(25); sfx.coin(S.coins % 12);
        burst(p.position.x, 1.5, 0, 6, 0xffd166, 5, .4, 4);
      } else if (type === 'shield'){
        S.shield = true; bubble.visible = true; sfx.power(); pop('SHIELD!', '#7ef9ff', 32);
        burst(S.x, 1.4, 0, 22, 0x7ef9ff, 8, .6, 0);
      } else {
        S.nitro = 3; S.boost = 100; sfx.power(); pop('NITRO!', '#d0a6ff', 34);
        burst(S.x, 1.4, 0, 22, 0xb06bff, 8, .6, 0);
      }
    }
  }

  // shockwave rings
  for (let i=waves.length-1;i>=0;i--){
    const w = waves[i]; w.t += dt; const k = w.t/.7;
    w.m.scale.setScalar(1 + k*38); w.m.position.x = S.x; w.m.material.opacity = Math.max(0, .9*(1-k));
    if (k >= 1){ scene.remove(w.m); w.m.geometry.dispose(); w.m.material.dispose(); waves.splice(i,1); }
  }
  if (bubble.visible){ const s = 1 + Math.sin(t*6)*.04; bubble.scale.setScalar(s); bubble.rotation.y += dt*1.5; }

  /* ---------------- police ---------------- */
  const phase = Math.floor(t*8)%2;
  policeRed.color.setHex(phase ? 0xff2244 : 0x40101a);
  policeBlue.color.setHex(phase ? 0x101a40 : 0x2a6bff);
  police.forEach((p,i) => {
    p.visible = S.running || S.over;
    const lane = clamp(S.lane + [0,-1,1,0][i] + (i===3 ? Math.round(Math.sin(t*.9)) : 0), 0, 3);
    p.position.x += (LANES[lane] - p.position.x) * Math.min(1, 3*dt);
    const tz = 4 + clamp(S.gap,0,GAP_MAX)/15 + (i>>1)*2.4;
    p.position.z += (tz - p.position.z) * Math.min(1, 3*dt);
    p.rotation.z = (LANES[lane] - p.position.x) * -.08;
    const pc = (phase ^ (i&1)) ? 0xff2244 : 0x2a6bff;
    p.userData.pl.color.setHex(pc); p.userData.glow.color.setHex(pc);
  });

  /* ---------------- fx ---------------- */
  if (S.running){
    // exhaust + boost flame
    if (S.boosting){
      for (let i=0;i<3;i++) emit(S.x + rand(-.15,.15), .95, 1.3, rand(-.6,.6), rand(-.3,.6), rand(3,8), i%2 ? 0x7ef9ff : 0xb06bff, .35, 0);
    } else if (Math.random() < .5) emit(S.x, .8, 1.2, rand(-.3,.3), rand(0,.5), rand(1,3), 0x9fb4ff, .25, 0);
    if (Math.abs(S.targetX - S.x) > 1.2) emit(S.x, .15, .6, rand(-1,1), rand(1,3), rand(2,5), 0xffd166, .25, 10);
  }
  const sc = player.userData.scarf;
  if (sc){ sc.rotation.y = Math.sin(t*14)*.3 + (S.targetX - S.x)*.12; sc.rotation.x = -.15 - ws*.003; }
  updateParticles(dt, ws);

  const lineK = clamp((ws-46)/32, 0, 1);
  streakMat.opacity = lineK*.55;
  const sl = clamp(ws*.07, 1, 6);
  streaks.forEach(m => {
    m.position.z += ws*dt*1.25; m.scale.z = sl;
    if (m.position.z > 16){ m.position.set(rand(-16,16), rand(.3,8), -170 - rand(0,25)); }
  });

  /* ---------------- camera ---------------- */
  S.shake = Math.max(0, S.shake - dt*2.6);
  const speedT = clamp((ws-14)/(S.maxSpeed-14), 0, 1);
  camera.position.set(S.x*.55 + (Math.random()-.5)*S.shake*.7, 5.6 + speedT*.6 + (Math.random()-.5)*S.shake*.5, 13.5 - speedT*2);
  camera.lookAt(S.x*.75, 1.2, -18);
  camera.rotateZ((S.targetX - S.x)*.012);
  camera.fov = 66 + speedT*12 + (S.boosting ? 6 : 0);
  camera.updateProjectionMatrix();

  /* ---------------- engine sound ---------------- */
  if (engGain){
    const on = S.running ? .07 : 0;
    engGain.gain.setTargetAtTime(on, AC.currentTime, .08);
    engOsc.frequency.setTargetAtTime(50 + ws*2.3 + (S.boosting?30:0), AC.currentTime, .08);
    engFilt.frequency.setTargetAtTime(300 + ws*8, AC.currentTime, .08);
  }

  /* ---------------- HUD ---------------- */
  $('score').textContent = Math.floor(S.score).toLocaleString();
  $('distLine').textContent = Math.floor(S.distance) + ' m · ' + S.coins + ' coins';
  $('speed').textContent = Math.round(S.speed*3.1) + ' km/h';
  $('gap').textContent = Math.max(0, Math.floor(S.gap)) + ' m';
  $('gapBar').style.width = clamp(S.gap/GAP_MAX*100, 0, 100) + '%';
  $('boostBar').style.width = S.boost + '%';
  $('combo').textContent = S.combo > 1 ? `COMBO ${S.combo} · ×${mult()}` : ' ';
  $('shieldTag').textContent = S.nitro > 0 ? 'NITRO ' + S.nitro.toFixed(1) + 's' : (S.shield ? '🛡 SHIELD READY' : ' ');
  $('speedfx').style.opacity = S.boosting && S.running ? 1 : 0;

  renderer.render(scene, camera);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
